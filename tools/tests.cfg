# A7: the list of tests that tools/run_all.gd runs, one per line, in this order.
#   <script in tools/>   <time limit in seconds>   [flags]
# Flags:
#   window      needs a real window (on GitHub it gets a virtual screen; skipped with --no-window)
#   manual      slow; runs only with --all or --only (never on every push)
#   end=TEXT    the start of the line that shows the test reached its end (default "RESULT:");
#               must be the last thing on the line
#   args=A,B    extra arguments for the test script (after its name)
# Time limits are about 4 × the time on the cloud computer (20 Nov 2026), at least 120 s.
# A new milestone test: add one line here. Screenshot (shots_*), benchmark (bench_*) and
# maker (make_*) scripts do not belong here - they make pictures or files, they don't check.

